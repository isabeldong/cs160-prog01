<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walk, Roll, Glide, Convert</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="converter">
      <header>
        <h1>Walk, Roll, Glide, Convert</h1>
        <p>Compare how long a trip takes with different ways to travel!</p>
      </header>

      <form id="trip-form">
        <fieldset class="mode-selector">
          <legend>Calculation Mode</legend>

          <input
            id="distance-mode-input"
            name="mode"
            type="radio"
            value="distance"
            checked
          >
          <label for="distance-mode-input">Distance Mode</label>

          <input
            id="time-mode-input"
            name="mode"
            type="radio"
            value="time"
          >
          <label for="time-mode-input">Time Mode</label>
        </fieldset>

        <div class="field">
          <label id="trip-value-label" for="trip-value-input">Distance (Miles)</label>
          <input
            id="trip-value-input"
            name="trip-value-input"
            type="number"
            min="0"
            step="any"
            placeholder="Ex: 8"
            required
          >
        </div>

        <div class="field">
          <label for="transport-input">Transport Type</label>
          <select id="transport-input" name="transport-input">
            <option value="all">All Transport Types</option>
          </select>
        </div>

        <button id="calculate-button" type="submit">Calculate travel time</button>
      </form>

      <section id="result-section" hidden></section>

    </main>

    <script src="script.js"></script>
  </body>
</html>
